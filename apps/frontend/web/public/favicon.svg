<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The Ntizo mark on its own ground.

    The mark is 445 wide against 1090 tall. Dropped bare into a favicon it is
    scaled to fit the square by its height, which leaves roughly five pixels of
    actual figure at 16px — a sliver with no contrast of its own, lighter or
    darker than the tab bar depending on a theme the icon cannot read. The tile
    is what makes it legible: it fills the pixel grid, and it carries the
    navy/white contrast itself, so one asset is right on a light tab bar and a
    dark one alike.

    The mark is the same two paths as src/shared/components/brand-mark.tsx,
    centred on 750,750 in their own coordinates and scaled to 68% of the tile's
    height. The navy is the brand's literal, not a palette token — see that
    file for why.

    apple-touch-icon.png is this same artwork rendered with rx="0": iOS masks
    its own corners, and rounding them here would round them twice.
  -->
  <rect width="512" height="512" rx="112" fill="#00244D"/>
  <g fill="#fff" transform="translate(256 256) scale(0.31938) translate(-750 -750)">
    <path d="M729.327 579.543L692.23 937.437L750.515 995.722L808.801 937.437L771.697 579.543L805.323 545.918C823.198 550.905 842.231 558.158 863.469 567.699L972.431 1295.06H527.569L636.531 567.699C658.043 557.933 677.291 550.576 695.375 545.592L729.327 579.543Z"/>
    <path d="M749.998 488.215C712.443 488.215 679.18 474.266 650.209 446.368C622.311 417.397 608.362 384.134 608.362 346.579C608.362 306.878 622.311 273.615 650.209 246.79C679.18 218.892 712.443 204.943 749.998 204.943C788.626 204.943 821.889 218.892 849.787 246.79C877.685 273.615 891.634 306.878 891.634 346.579C891.634 384.134 877.685 417.397 849.787 446.368C821.889 474.266 788.626 488.215 749.998 488.215Z"/>
  </g>
</svg>
